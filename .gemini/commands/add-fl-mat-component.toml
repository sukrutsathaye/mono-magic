description = "Create or extend a Flutter >=3.50 Material 3 widget in libs/ui/fl-mat with full Material 3 parameter coverage, smart polymorphic parameters, flutter_test widget tests (>=80%), and 7-state Widgetbook use-cases."
prompt = """
# Add Flutter Material 3 (`fl-mat`) Widget

Follow the `ui-fl-mat` skill (`.gemini/skills/ui-fl-mat/SKILL.md`), `interactive-stories` (`.gemini/skills/interactive-stories/SKILL.md`), `polyglot-unit-testing` (`.gemini/skills/polyglot-unit-testing/SKILL.md`), `code-doc-generator` (`.gemini/skills/code-doc-generator/SKILL.md`), and `repo-updater` (`.gemini/skills/repo-updater/SKILL.md`).

## User Request
{{args}}

