packages:
  - "apps/*"
  - "libs/ui/*"
  - "libs/utils/ts-*"
  - "libs/data-access/ts-*"
  - "libs/features/ts-*"
  - "!libs/ui/fl-mat"

allowBuilds:
  nx: true
  esbuild: true
  "@bufbuild/buf": true
  "@parcel/watcher": false
  unrs-resolver: false
  lmdb: false
  msgpackr-extract: false

minimumReleaseAgeExclude:
  - svelte-eslint-parser@1.11.0
