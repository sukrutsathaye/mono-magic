name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      # Nx Cloud paused while applying for the free Open Source plan (cloud-support@nrwl.io / https://nx.dev/contact).
      # Re-enable by removing NX_NO_CLOUD and uncommenting start-workers & fix-ci below.
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: nrwl/nx-set-shas@v4
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/setup-flutter
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
      # - run: pnpm nx-cloud start-workers

      - run: pnpm nx affected -t lint typecheck test build

      # - run: pnpm nx fix-ci
      #   if: always()
