# Discover, build, and deploy all workspace Storybooks and Flutter Widgetbooks to GitHub Pages
name: Deploy Showcases to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      base_path: ${{ steps.pages.outputs.base_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Discover Storybooks and Widgetbooks
        id: list
        run: echo "matrix=$(node tools/ci/storybook-pages.mjs discover --matrix)" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm
      - name: Setup Flutter
        if: matrix.type == 'widgetbook'
        uses: ./.github/actions/setup-flutter
      - name: Build ${{ matrix.type }} (${{ matrix.name }})
        env:
          PAGES_BASE_PATH: ${{ needs.discover.outputs.base_path }}
        run: node tools/ci/storybook-pages.mjs build "${{ matrix.name }}"
      - name: Upload built showcase
        uses: actions/upload-artifact@v4
        with:
          name: showcase-${{ matrix.name }}
          path: dist/storybook-pages
          if-no-files-found: error

  assemble:
    needs: [discover, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download built showcases
        uses: actions/download-artifact@v4
        with:
          pattern: showcase-*
          merge-multiple: true
          path: dist/storybook-pages
      - name: Assemble GitHub Pages portal
        run: node tools/ci/storybook-pages.mjs assemble
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/storybook-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: assemble
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
