# Buf v2 offline-safe code generation template for UI contracts (tokens, enums, XYFlow PageGraph AST).
version: v2
clean: true
managed:
  enabled: true
inputs:
  - directory: proto
plugins:
  # Local TypeScript codegen via @bufbuild/protoc-gen-es (wired directly into atomic-design-interfaces)
  - local: protoc-gen-es
    out: ../atomic-design-interfaces/src/gen
    opt:
      - target=ts
      - import_extension=.js
