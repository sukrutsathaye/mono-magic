<mat-menu
  #menu="matMenu"
  [xPosition]="xPosition()"
  [yPosition]="yPosition()"
  [overlapTrigger]="overlapTrigger()"
  [hasBackdrop]="hasBackdrop()"
  [backdropClass]="backdropClass()"
  [classList]="panelClass()"
  [aria-label]="ariaLabel() || null"
  [aria-labelledby]="ariaLabelledby() || null"
  [aria-describedby]="ariaDescribedby() || null"
  (closed)="closed.emit($event)"
>
  @for (item of items(); track itemKey(item, $index)) {
    @if (item.children?.length) {
      <button
        mat-menu-item
        type="button"
        [role]="item.role ?? 'menuitem'"
        [disabled]="item.disabled ?? false"
        [disableRipple]="item.disableRipple ?? false"
        [matMenuTriggerFor]="submenuFor(item, $index)"
      >
        @if (item.icon) {
          <mat-icon>{{ item.icon }}</mat-icon>
        }
        <span>{{ item.label }}</span>
      </button>
    } @else if (item.link) {
      <a
        mat-menu-item
        [href]="item.disabled ? null : item.link"
        [role]="item.role ?? 'menuitem'"
        [disabled]="item.disabled ?? false"
        [disableRipple]="item.disableRipple ?? false"
        (click)="selectItem(item)"
      >
        @if (item.icon) {
          <mat-icon>{{ item.icon }}</mat-icon>
        }
        <span>{{ item.label }}</span>
      </a>
    } @else {
      <button
        mat-menu-item
        type="button"
        [role]="item.role ?? 'menuitem'"
        [disabled]="item.disabled ?? false"
        [disableRipple]="item.disableRipple ?? false"
        (click)="selectItem(item)"
      >
        @if (item.icon) {
          <mat-icon>{{ item.icon }}</mat-icon>
        }
        <span>{{ item.label }}</span>
      </button>
    }
  }
</mat-menu>

@for (item of items(); track itemKey(item, $index)) {
  @if (item.children?.length) {
    <magic-menu-submenu
      [ownerKey]="itemKey(item, $index)"
      [items]="item.children!"
      [xPosition]="xPosition()"
      [yPosition]="yPosition()"
      [overlapTrigger]="false"
      [hasBackdrop]="hasBackdrop()"
      [backdropClass]="backdropClass()"
      [panelClass]="panelClass()"
      (itemSelected)="itemSelected.emit($event)"
    />
  }
}
