<mat-accordion
  class="magic-accordion__group"
  [class]="'magic-accordion__group magic-accordion__group--' + appearance()"
  [multi]="multiple()"
  [displayMode]="appearance() === 'outlined' ? 'flat' : 'default'"
  [attr.id]="id() || null"
  [attr.data-testid]="testId() || null"
  [attr.aria-label]="ariaLabel() || null"
>
  @for (item of items(); track item.id) {
    <mat-expansion-panel
      class="magic-accordion__panel"
      [expanded]="isPanelExpanded(item.id)"
      [disabled]="item.disabled ?? false"
      [attr.data-testid]="testId() ? testId() + '-panel-' + item.id : null"
      (opened)="onPanelOpened(item)"
      (closed)="onPanelClosed(item)"
    >
      <mat-expansion-panel-header class="magic-accordion__header">
        <mat-panel-title class="magic-accordion__title">
          @if (item.icon) {
            <mat-icon class="magic-accordion__icon" aria-hidden="true">{{
              item.icon
            }}</mat-icon>
          }
          <span>{{ item.title }}</span>
        </mat-panel-title>
        @if (item.summary) {
          <mat-panel-description class="magic-accordion__summary">
            {{ item.summary }}
          </mat-panel-description>
        }
      </mat-expansion-panel-header>

      <div class="magic-accordion__body">
        @if (customPanelFor(item.id); as tpl) {
          <ng-container *ngTemplateOutlet="tpl" />
        } @else if (item.content) {
          <p class="magic-accordion__text">{{ item.content }}</p>
        }
      </div>
    </mat-expansion-panel>
  }
</mat-accordion>
