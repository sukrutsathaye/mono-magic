[project]
name = "py-proto-contracts"
version = "0.1.0"
description = "Generated Python Protobuf wire contracts from libs/data-access/proto-contracts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "protobuf>=5.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generated/py/monomagic"]

[tool.hatch.build.targets.editable]
dev-mode-dirs = ["generated/py"]
