# Buf v2 offline-safe code generation template for mono-magic data-access wire contracts.
# Generates TypeScript ES + .d.ts directly into libs/data-access/ts-interfaces/src/gen.
# Python (*_pb2.py + *_pb2.pyi) is generated offline via grpc_tools.protoc in project.json:generate.
version: v2
clean: true
managed:
  enabled: true
inputs:
  - directory: proto
plugins:
  - local: protoc-gen-es
    out: ../ts-interfaces/src/gen
    opt:
      - target=ts
      - import_extension=.js
