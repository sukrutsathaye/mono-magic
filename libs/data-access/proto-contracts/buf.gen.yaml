# Buf v2 offline-safe code generation template for mono-magic data-access wire contracts.
# Emits TypeScript into libs/data-access/proto-contracts/generated/ts.
# Python (*_pb2.py + *_pb2.pyi) is emitted into generated/py via project.json:generate.
version: v2
clean: true
managed:
  enabled: true
inputs:
  - directory: proto
plugins:
  - local: protoc-gen-es
    out: generated/ts
    opt:
      - target=ts
      - import_extension=.js
