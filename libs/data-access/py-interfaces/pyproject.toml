[project]
name = "py-data-access-interfaces"
version = "0.1.0"
description = "Framework- and vendor-agnostic Python data-access DTOs, Protocols, ABCs, and pytest contract compliance helpers for mono-magic."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "py-proto-contracts",
    "pydantic>=2.10.0",
]

[tool.uv.sources]
py-proto-contracts = { workspace = true }

[dependency-groups]
dev = [
    "grpcio-tools>=1.68.0",
    "pyright>=1.1.380",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_data_access_interfaces"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
