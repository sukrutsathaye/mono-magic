[project]
name = "py-reflective-nlp"
version = "0.1.0"
description = "Contract-first Python data-access and NLP/LLM orchestration providers for Reflective Learning in mono-magic."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "py-data-access-interfaces",
    "py-utils-common",
    "py-utils-nlp",
]

[tool.uv.sources]
py-data-access-interfaces = { workspace = true }
py-utils-common = { workspace = true }
py-utils-nlp = { workspace = true }

[dependency-groups]
dev = [
    "pyright>=1.1.380",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_reflective_nlp"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
